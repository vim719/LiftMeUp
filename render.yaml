# Render Blueprint for LiftMeUp.
# Two services only, split so a change under one directory never triggers a
# deploy of the other, and a docs-only change (root markdown / docs/**)
# triggers neither. Both services now use autoDeployTrigger: commit — see
# the incident notes below for why. Branch protection on main already
# requires CI to pass before anything merges, so neither service deploys
# unreviewed/failing code — this only removes Render's own (buggy, for
# these services) webhook-driven wait for a second, redundant confirmation
# that CI passed.
#
# NOTE (manual step at setup time): connecting this repo to Render in the
# first place (New + > Blueprint > select this repo) is still a one-time
# manual step in the Render dashboard.
#
# NOTE: if "liftmeup-backend" is already claimed elsewhere on Render, the
# service gets a random suffix (e.g. liftmeup-backend-xxxx.onrender.com).
# ALLOWED_HOSTS/VITE_API_BASE_URL below must match the actual assigned
# hostname — check it after the first deploy (and again if this service is
# ever deleted and recreated) and update them if it differs.
#
# INCIDENT (2026-07-28): liftmeup-backend's Auto-Deploy silently stopped
# firing for ~22h/36+ commits despite green CI the whole time and an
# identically-configured liftmeup-frontend deploying normally — Render's
# Events tab showed zero attempts (not even a skipped/filtered one) between
# the last successful auto-deploy and several "Triggered by you via CLI"
# manual deploys, ruling out checksPass/build-filter logic as the cause.
# Toggling liftmeup-backend's Auto-Deploy setting off then back on in the
# dashboard (a suspected fix for a dropped webhook subscription) did NOT
# resolve it — the very next merged, CI-green commit still needed a manual
# deploy. Switched liftmeup-backend to autoDeployTrigger: commit to route
# around whatever's broken in Render's checksPass handling for this
# specific service, rather than depending on a webhook path that's proven
# unreliable here.
#
# INCIDENT (2026-07-29): liftmeup-frontend repeated the exact same silent-
# failure pattern — checksPass stopped triggering deploys despite green CI,
# with no corresponding entry in Render's Events tab. Applied the same fix:
# switched liftmeup-frontend to autoDeployTrigger: commit rather than
# continuing to depend on a webhook path proven unreliable on this Render
# account for both services.

services:
  - type: web
    name: liftmeup-backend
    runtime: python
    rootDir: backend
    # Free plan: no payment method needed, but the service spins down after
    # ~15 min idle and the next request takes ~1 min to wake it. Open the
    # site a few minutes before any demo. Switch to `starter` to keep it warm.
    plan: free
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/**/*.md
    buildCommand: >-
      curl -LsSf https://astral.sh/uv/install.sh | sh &&
      uv sync --locked --no-dev &&
      uv run python manage.py collectstatic --noinput &&
      uv run python manage.py migrate
    startCommand: "uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: ALLOWED_HOSTS
        value: liftmeup-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: liftmeup-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://liftmeup-frontend.onrender.com
      # Read by apps/compliance/narration.py for the AI briefing. Entered in
      # the Render dashboard (prompted on Blueprint creation); never commit it.
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: liftmeup-frontend
    runtime: static
    rootDir: frontend
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
      ignoredPaths:
        - frontend/**/*.md
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://liftmeup-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: liftmeup-db
    databaseName: liftmeup
    user: liftmeup
    # Free plan: 1 GB, and Render deletes free databases 30 days after
    # creation (with an upgrade window first). Fine for the hackathon;
    # move to `basic-256mb` before relying on it longer-term.
    plan: free
